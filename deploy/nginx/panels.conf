# Panel subdomains — indoeasyscent.com
#   panelhosting.indoeasyscent.com -> Cockpit (system admin, port 9090)
#   analytics.indoeasyscent.com -> Umami  (analytics, port 3001)
#
# Deploy:
#   scp deploy/nginx/panels.conf idesys-vps:/tmp/panels.conf
#   ssh idesys-vps 'sudo cp /tmp/panels.conf /etc/nginx/sites-available/panels.conf \
#                   && sudo ln -sf /etc/nginx/sites-available/panels.conf /etc/nginx/sites-enabled/ \
#                   && sudo nginx -t && sudo systemctl reload nginx'
#
# DNS prerequisite (Hostinger zone editor):
#   panelhosting.indoeasyscent.com  -> A  34.101.66.215
#   analytics.indoeasyscent.com -> A  34.101.66.215

# Shared TLS include for both panel hosts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name panelhosting.indoeasyscent.com analytics.indoeasyscent.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------- Umami (analytics) ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.indoeasyscent.com;

    ssl_certificate     /etc/letsencrypt/live/indoeasyscent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indoeasyscent.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep the panel out of search results. These headers are read by Google
    # on every crawl, so this works even for a crawler that never renders JS.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------- Cockpit (system admin) ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panelhosting.indoeasyscent.com;

    ssl_certificate     /etc/letsencrypt/live/indoeasyscent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indoeasyscent.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Cockpit's own login is the access control; this block just hides it from
    # crawlers and keeps the console off the public site nav.
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
