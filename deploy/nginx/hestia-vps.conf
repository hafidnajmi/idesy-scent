# Hestia Webadmin — vps.indoeasyscent.com
# Proxy via nginx on port 443 (VPC firewall allows 443).
# Hestia internal: 127.0.0.1:8083 (HTTP inside; TLS terminated at this vhost).
#
# Deploy:
#   scp deploy/nginx/hestia-vps.conf idesys-vps:/tmp/hestia-vps.conf
#   ssh idesys-vps 'sudo cp /tmp/hestia-vps.conf /etc/nginx/sites-available/hestia-vps.conf \
#                   && sudo ln -sf /etc/nginx/sites-available/hestia-vps.conf /etc/nginx/sites-enabled/ \
#                   && sudo nginx -t && sudo systemctl reload nginx'
#
# DNS prerequisite:
#   vps.indoeasyscent.com -> A 34.101.66.215

server {
    listen 80;
    listen [::]:80;
    server_name vps.indoeasyscent.com;

    # Certbot renewal (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.indoeasyscent.com;

    ssl_certificate     /etc/letsencrypt/live/vps.indoeasyscent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.indoeasyscent.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}