# Nginx config for indoeasyscent.com — static site, no PHP/Node
# Ubuntu/Debian. Replace 203.0.113.10 with your VPS IP before use.
#
#   sudo cp deploy/nginx/indoeasyscent.conf /etc/nginx/sites-available/indoeasyscent.com
#   sudo ln -s /etc/nginx/sites-available/indoeasyscent.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=idesy_ratelimit:10m rate=20r/s;

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name indoeasyscent.com www.indoeasyscent.com;

    # ACME challenge must stay on plain HTTP for renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://indoeasyscent.com$request_uri;
    }
}

# ---- Canonical HTTPS host ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.indoeasyscent.com;

    ssl_certificate     /etc/letsencrypt/live/indoeasyscent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indoeasyscent.com/privkey.pem;

    return 301 https://indoeasyscent.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name indoeasyscent.com;

    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/indoeasyscent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indoeasyscent.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Security headers (ported from Cloudflare _headers) ----
    # Tailwind runs from cdn.tailwindcss.com and compiles classes at runtime,
    # so 'unsafe-inline' + 'unsafe-eval' in script-src are required. Tighten only
    # after switching Tailwind to a build step (see docs/SEO.md "CSP hardening").
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ---- Caching ----
    # HTML: must revalidate, otherwise deploys go stale for visitors
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Versioned-ish static assets: cache hard, but revalidate on deploy
    location ~* \.(?:css|js|svg|woff2?|jpg|jpeg|png|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        access_log off;
        log_not_found off;
    }

    # ---- SEO files: never cache, so changes take effect immediately ----
    location = /robots.txt {
        add_header Cache-Control "no-cache" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache" always;
    }

    # ---- 404 ----
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- Static-only hardening: no PHP, no CGI, no path traversal ----
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:php|py|sh|pl|cgi|asp|aspx|jsp)$ {
        deny all;
    }

    # Rate limit the (static) inquiry form endpoint surface
    location / {
        limit_req zone=idesy_ratelimit burst=40 nodelay;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/indoeasyscent.access.log;
    error_log  /var/log/nginx/indoeasyscent.error.log;
}
